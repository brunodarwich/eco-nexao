  /api/v1/admin/catalog/support-points/:
    post:
      operationId: createAdminSupportPoint
      description: |-
        Cria transacionalmente um ponto de apoio administrativo como rascunho.
        A operação nunca publica, envia para revisão ou mescla duplicatas automaticamente.
        Este contrato antecede a implementação do endpoint e deve ser refletido nas anotações
        Django antes da ativação da rota.
      tags:
        - Admin catalog
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description:
            UUID v4 reutilizado somente pelo mesmo usuário, região e payload
            por 24 horas.
          schema:
            type: string
            format: uuid
        - in: header
          name: X-CSRFToken
          required: true
          description: Token CSRF correspondente à sessão administrativa.
          schema:
            type: string
            minLength: 1
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportPointCreateRequest'
      security:
        - cookieAuth: []
      responses:
        '201':
          description: Ponto de apoio criado exclusivamente como rascunho.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportPointCreateResponse'
        '400':
          description:
            Corpo, CSRF, coordenadas, contatos, identificadores ou relações
            inválidos.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportPointCreateError'
        '401':
          description: Sessão administrativa ausente ou expirada.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportPointCreateError'
        '403':
          description: Papel, ação, escopo regional ou proteção CSRF insuficiente.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportPointCreateError'
        '409':
          description: Duplicidade, conflito idempotente ou concorrência detectada.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportPointCreateError'
        '429':
          description: Limite configurado para criação manual excedido.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            Retry-After:
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportPointCreateError'
        '500':
          description: Falha interna segura; nenhuma parte do agregado permanece gravada.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportPointCreateError'
