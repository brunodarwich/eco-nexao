            - other_public
        source_reference:
          type: string
          minLength: 1
          maxLength: 200
        verified_at:
          type: string
          format: date-time
      required:
        - channel_type
        - is_public
        - source_reference
        - source_type
        - value
        - verified_at
    SupportPointEmailContactInput:
      type: object
      additionalProperties: false
      properties:
        channel_type:
          type: string
          enum:
            - email
        value:
          type: string
          format: email
          maxLength: 254
        is_public:
          type: boolean
          enum:
            - true
        source_type:
          type: string
          enum:
            - consolidated_sheet
            - tourism_inventory
            - other_public
        source_reference:
          type: string
          minLength: 1
          maxLength: 200
        verified_at:
          type: string
          format: date-time
      required:
        - channel_type
        - is_public
        - source_reference
        - source_type
        - value
        - verified_at
    SupportPointUrlContactInput:
      type: object
      additionalProperties: false
      properties:
        channel_type:
          type: string
          enum:
            - website
            - instagram
        value:
          type: string
          format: uri
          pattern: ^https://
          maxLength: 500
        is_public:
          type: boolean
          enum:
            - true
        source_type:
          type: string
          enum:
            - consolidated_sheet
            - tourism_inventory
            - other_public
        source_reference:
          type: string
          minLength: 1
          maxLength: 200
        verified_at:
          type: string
          format: date-time
      required:
        - channel_type
        - is_public
        - source_reference
        - source_type
        - value
        - verified_at
    SupportPointContactInput:
      oneOf:
        - $ref: '#/components/schemas/SupportPointPhoneContactInput'
        - $ref: '#/components/schemas/SupportPointEmailContactInput'
        - $ref: '#/components/schemas/SupportPointUrlContactInput'
    SupportPointRouteLinkInput:
      type: object
      additionalProperties: false
      properties:
        route_id:
          type: string
          format: uuid
        stage_id:
          type: string
          format: uuid
          nullable: true
        route_role:
          type: string
          enum:
            - experience
            - support
            - start
            - stop
            - emergency
            - service
        editorial_position:
          type: integer
          minimum: 1
          maximum: 32767
        is_featured:
          type: boolean
        sponsorship_label:
          type: string
          maxLength: 160
      required:
        - editorial_position
        - is_featured
        - route_id
        - route_role
        - sponsorship_label
    SupportPointCreateRequest:
      type: object
      additionalProperties: false
      properties:
        actor:
          $ref: '#/components/schemas/SupportPointActorInput'
        location:
          $ref: '#/components/schemas/SupportPointLocationInput'
        contacts:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SupportPointContactInput'
        route_links:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SupportPointRouteLinkInput'
      required:
        - actor
        - contacts
        - location
        - route_links
    SupportPointRouteLinkResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        route_id:
          type: string
          format: uuid
        stage_id:
          type: string
          format: uuid
          nullable: true
      required:
        - id
        - route_id
        - stage_id
    SupportPointCreateResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        actor_kind:
          type: string
          enum:
            - support
        editorial_status:
          type: string
          enum:
            - draft
        partnership_type:
          type: string
          enum:
            - editorial
        region_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        contact_ids:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uuid
        route_links:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/SupportPointRouteLinkResponse'
        created_at:
          type: string
          format: date-time
      required:
        - actor_kind
        - contact_ids
        - created_at
        - editorial_status
        - id
        - location_id
        - partnership_type
        - region_id
        - route_links
    SupportPointCreateError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - validation_error
            - invalid_relation
            - invalid_csrf
            - authentication_required
            - permission_denied
            - duplicate_support_point
            - idempotency_conflict
            - concurrent_conflict
            - rate_limited
            - internal_error
            - region_boundary_unavailable
            - request_failed
        message:
          type: string
          minLength: 1
          maxLength: 240
        field_errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              maxLength: 240
        request_id:
          type: string
          format: uuid
        duplicate_candidate_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
      required:
        - code
        - field_errors
        - message
        - request_id
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: econexao_admin_sessionid
