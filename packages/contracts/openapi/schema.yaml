openapi: 3.0.3
info:
  title: ECOnexão API
  version: 1.0.0
  description: API pública e administrativa versionada da ECOnexão.
paths:
  /api/v1/admin/analytics/summary:
    get:
      operationId: api_v1_admin_analytics_summary_retrieve
      description: |-
        Visão resumida de analytics agregada para o painel administrativo.
        Protegido por autenticação e livre de identificadores individuais.
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_events:
                    type: integer
                  aggregates:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                        event_name:
                          type: string
                        region_slug:
                          type: string
                        route_slug:
                          type: string
                        count:
                          type: integer
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
          description: ''
  /api/v1/admin/audit-logs:
    get:
      operationId: listAdminAuditEvents
      parameters:
      - in: query
        name: action
        schema:
          enum:
          - auth.login
          - auth.logout
          - editorial.approve
          - publication.publish
          - publication.restore
          - external.discovery
          - import.commit
          - report.moderate
          type: string
          minLength: 1
        description: |-
          * `auth.login` - Login administrativo
          * `auth.logout` - Logout administrativo
          * `editorial.approve` - Aprovação editorial
          * `publication.publish` - Publicação
          * `publication.restore` - Restauração
          * `external.discovery` - Descoberta externa
          * `import.commit` - Confirmação de importação
          * `report.moderate` - Moderação de relato
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: region_id
        schema:
          type: string
          format: uuid
      - in: query
        name: target_id
        schema:
          type: string
          maxLength: 128
          minLength: 1
      - in: query
        name: target_type
        schema:
          type: string
          maxLength: 64
          minLength: 1
      tags:
      - Admin audit
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
          description: ''
