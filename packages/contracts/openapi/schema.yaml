  /api/v1/admin/audit-logs:
    get:
      operationId: listAdminAuditEvents
      parameters:
        - in: query
          name: action
          schema:
            enum:
              - auth.login
              - auth.logout
              - editorial.approve
              - publication.publish
              - publication.restore
              - external.discovery
              - import.commit
              - report.moderate
              - catalog.support_point.create
            type: string
            x-spec-enum-id: 64a9d5428456767d
            minLength: 1
          description: |-
            * `auth.login` - Login administrativo
            * `auth.logout` - Logout administrativo
            * `editorial.approve` - Aprovação editorial
            * `publication.publish` - Publicação
            * `publication.restore` - Restauração
            * `external.discovery` - Descoberta externa
            * `import.commit` - Confirmação de importação
            * `report.moderate` - Moderação de relato
            * `catalog.support_point.create` - Cadastro de ponto de apoio
        - in: query
          name: limit
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: region_id
          schema:
            type: string
            format: uuid
        - in: query
          name: target_id
          schema:
            type: string
            maxLength: 128
            minLength: 1
        - in: query
          name: target_type
          schema:
            type: string
            maxLength: 64
            minLength: 1
      tags:
        - Admin audit
      security:
        - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditError401'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditError403'
          description: ''
