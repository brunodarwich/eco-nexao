[project]
name = "econexao-development-dashboard"
version = "0.1.0"
description = "Painel local para acompanhamento das specs de desenvolvimento da ECOnexão"
requires-python = ">=3.12,<3.14"
dependencies = [
  "streamlit>=1.57,<1.58",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<0.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
